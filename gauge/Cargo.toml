[package]
name = "mindone_gauge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mindone_gauged"
path = "src/main.rs"

[features]
raw-netlink = []

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
nix = { version = "0.29", features = ["event", "poll", "signal", "socket", "time", "uio"] }
rustix = { version = "1.0", features = ["net"] }
